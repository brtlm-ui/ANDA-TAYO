{% extends 'accounts/_auth_base.html' %}
{% load ui %}

{% block title %}Password changed{% endblock %}
{% block panel_text %}You're all set.{% endblock %}

{% block form %}
<span class="icon-badge h-12 w-12" style="background: #d1fae5">{% icon 'check' 'h-5 w-5' %}</span>
<h1 class="mt-4 text-3xl font-extrabold tracking-tight">Password changed</h1>
<p class="mt-2 text-sm text-stone-600">You can log in with your new password now.</p>
<a href="{% url 'login' %}" class="btn btn-dark btn-lg mt-6 w-full">Log in</a>
{% endblock %}
