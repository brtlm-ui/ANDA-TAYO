{% load ui %}
{# One review / "Tambayan Tale". Used on the landing page and the spot page. #}
{# Expects `tale`; optional `show_spot` (link to the spot) and `can_delete` (staff delete button). #}
<figure class="rounded-2xl border border-amber-300 bg-butter p-5">
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-3">
            <span class="icon-badge h-10 w-10 bg-white text-sm font-extrabold">{{ tale.reviewer_name|slice:":2"|upper }}</span>
            <div class="text-sm leading-tight">
                <b class="block">{{ tale.reviewer_name }}</b>
                {% if tale.reviewer_note %}<span class="text-xs text-stone-700">{{ tale.reviewer_note }}</span>{% endif %}
                {% if show_spot %}<a class="block text-xs font-semibold underline" href="{% url 'spot_detail' tale.spot.id %}">{{ tale.spot.name }}</a>{% endif %}
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="tag" style="--tag-bg: #fff">{% icon 'star' 'h-3 w-3 fill-current text-amber-500' %} {{ tale.rating }}/5</span>
            {% if can_delete or user.is_authenticated and tale.user_id == user.id %}
            <form method="post" action="{% url 'delete_review' tale.id %}" onsubmit="return confirm('Delete this review?');">
                {% csrf_token %}<button class="btn btn-danger btn-sm">Delete</button>
            </form>
            {% endif %}
        </div>
    </div>
    <blockquote class="mt-3 text-sm leading-relaxed">&ldquo;{{ tale.comment }}&rdquo;</blockquote>
</figure>
