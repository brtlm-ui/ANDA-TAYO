<div class="space-y-2" role="status">
    {% for message in messages %}
    <div class="rounded-2xl border px-4 py-3 text-sm font-medium {% if message.tags == 'error' %}border-red-300 bg-red-50 text-red-800{% else %}border-emerald-300 bg-emerald-50 text-emerald-800{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
